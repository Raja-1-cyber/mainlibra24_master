<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Libra 24 - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="top">
    <div class="brand">LIBRA 24</div>
    <div class="top-right">
      <div class="bal">Coins: <span id="coins">0</span></div>
      <span id="who">Player</span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="panel active" style="padding-top:20px">
    <div class="card">
      <h3>GAMES</h3>
      <div class="games-grid" id="gamesGrid"></div>
    </div>
    <div class="card">
      <h3>YOUR HISTORY</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Time</th><th>Game</th><th>Coins</th></tr></thead>
        <tbody id="histTable"></tbody>
      </table></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let user = null;

    try {
      user = JSON.parse(localStorage.getItem('l24'));
      if (!user || user.role !== 'player') throw 0;
    } catch { location.href = '/login'; }

    document.getElementById('who').textContent = user.username;
    document.getElementById('coins').textContent = Number(user.coins||0).toLocaleString();

    socket.emit('auth', { username: user.username, token: user.token }, res => {
      if (!res.success) { localStorage.removeItem('l24'); location.href = '/login'; return; }
      socket.emit('get_state');
    });

    function toast(m) {
      const t = document.getElementById('toast');
      t.textContent = m; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }
    function logout() { localStorage.removeItem('l24'); location.href = '/login'; }

    function renderGames(games) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      Object.values(games || {}).filter(g => g.active !== false).sort((a,b) => (a.order||0)-(b.order||0)).forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = (g.image ? `<img src="${g.image}" alt="">` : `<div class="game-placeholder">${(g.name||'?')[0]}</div>`) + `<div class="game-name">${g.name}</div>`;
        card.onclick = () => enterGame(g.id);
        grid.appendChild(card);
      });
      if (!grid.children.length) grid.innerHTML = '<div style="color:#5a6a62;padding:20px">No active games</div>';
    }

    function enterGame(gameId) {
      socket.emit('player_enter_game', { gameId }, res => {
        if (!res.success) return toast(res.message || 'Game not available');
        const url = res.url || ({dragon:'/games/dragon-tiger/index.html',teenpatti:'/games/teen-patti/index.html',andarbahar:'/games/andar-bahar/index.html',lucky7:'/games/lucky-7/index.html'})[gameId];
        if (url) location.href = url;
        else toast('Game URL missing');
      });
    }

    socket.on('player_state', d => {
      if (d.coins != null) {
        user.coins = d.coins;
        document.getElementById('coins').textContent = Number(d.coins).toLocaleString();
        localStorage.setItem('l24', JSON.stringify(user));
      }
      renderGames(d.games);
      const tb = document.getElementById('histTable');
      const list = d.gameHistory || [];
      tb.innerHTML = list.length ? list.map(g => `<tr><td>${new Date(g.time).toLocaleString()}</td><td>${g.game}</td><td>${Number(g.coins||0).toLocaleString()}</td></tr>`).join('') : '<tr><td colspan="3" style="color:#5a6a62">No history</td></tr>';
    });
    socket.on('balance_update', d => {
      if (d.username === user.username) {
        user.coins = d.coins;
        document.getElementById('coins').textContent = Number(d.coins).toLocaleString();
        localStorage.setItem('l24', JSON.stringify(user));
      }
    });
    socket.on('games_updated', renderGames);
  </script>
</body>
</html>
