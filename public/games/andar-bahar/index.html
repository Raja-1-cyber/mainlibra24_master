    .game-name{color:var(--text);letter-spacing:1px}
    .round-id{font-size:.72rem;color:#64748b}

    .stage{background:#000;min-height:280px;position:relative;overflow:hidden;padding:16px 10px 20px}

    .user-row:last-child{border-bottom:none}
    .uname{font-weight:700}.ucoins{font-size:.8rem;color:var(--muted);margin-top:2px}
    .user-actions{display:flex;gap:6px}
    .round-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
    .round-controls .btn{flex:1;min-width:120px;padding:14px;font-size:.9rem}
    .force-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}

    .live-bets-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:10px}
    .live-bets-table th{text-align:left;padding:8px;color:var(--yellow);border-bottom:1px solid #334155;font-size:.72rem}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;font-size:.88rem;z-index:9999;opacity:0;transition:all .3s;max-width:90%;text-align:center}

      .round-controls .btn{min-width:100%}
    }
  </style>

function randCard(){
  const suits=[{s:'♠',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'},{s:'♣',c:'black'}];
  const suit=suits[Math.floor(Math.random()*4)];

      }
    } else {
      // i === matchOn — winning card
      const winSuit=suits[Math.floor(Math.random()*4)];
      const winCard={rank:joker.rank,display:joker.display,suit:winSuit,color:(winSuit==='♥'||winSuit==='♦')?'red':'black'};
      if(winner==='andar'){
        // Andar gets the match; Bahar has matchOn-1 cards already
        andar.push(winCard);
      } else {
        // Bahar wins: both sides had matchOn-1 non-match, then bahar gets match
        // need one more non-match on andar first this round? Standard: deal Andar then Bahar alternate
        // For bahar win on Nth bahar card: andar has N cards (non-match), bahar has N-1 then match
        let a=randCard(); while(a.rank===joker.rank) a=randCard();
        andar.push(a);
        bahar.push(winCard);
      }
    }
  }
  // Fix alternate deal realism for andar win:
  // Rebuild cleaner:
  return rebuildDeal(winner, joker, matchOn);
}
function rebuildDeal(winner, joker, matchOn){
  const andar=[], bahar=[];
  const suits=['♠','♥','♦','♣'];
  // Alternate: 1st card Andar, 2nd Bahar, 3rd Andar...
  // Andar wins on Andar card number matchOn (Andar cards count = matchOn)
  // Bahar wins on Bahar card number matchOn
  if(winner==='andar'){
    for(let n=1;n<=matchOn;n++){
      if(n<matchOn){
        let a=randCard(); while(a.rank===joker.rank) a=randCard();
        andar.push(a);
        let b=randCard(); while(b.rank===joker.rank) b=randCard();
        bahar.push(b);
      } else {
        const winSuit=suits[Math.floor(Math.random()*4)];
        andar.push({rank:joker.rank,display:joker.display,suit:winSuit,color:(winSuit==='♥'||winSuit==='♦')?'red':'black'});
      }
    }
  } else {
    for(let n=1;n<=matchOn;n++){
      let a=randCard(); while(a.rank===joker.rank) a=randCard();
      andar.push(a);
      if(n<matchOn){
        let b=randCard(); while(b.rank===joker.rank) b=randCard();
        bahar.push(b);
      } else {
        const winSuit=suits[Math.floor(Math.random()*4)];
        bahar.push({rank:joker.rank,display:joker.display,suit:winSuit,color:(winSuit==='♥'||winSuit==='♦')?'red':'black'});
      }
    }
  }
  return { joker, andar, bahar, winner, matchOn };
}

function getQuery(){
  const q={};
  (location.search||'').slice(1).split('&').forEach(part=>{
    if(!part) return;
    const i=part.indexOf('=');
    const k=decodeURIComponent(i<0?part:part.slice(0,i));
    const v=decodeURIComponent(i<0?'':part.slice(i+1));
    if(k) q[k]=v;
  });
  return q;
}

function stopEngine(){
  if(engineTimer){clearInterval(engineTimer);engineTimer=null}
  if(nextRoundTimer){clearTimeout(nextRoundTimer);nextRoundTimer=null}
}
async function autoStartRound(){
  const r=roundCache||{};
  if(r.phase==='betting'||r.phase==='locked'||r.phase==='waiting'||r.phase==='dealing'){toast('Round running');return}
  stopEngine();
  const rid=Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*999);
  const earlyJoker = randCard();
  await fdb.ref(ROOT+'/round').set({
    id:rid,phase:'betting',timer:BET_WINDOW,
    result:null,deal:null,joker:earlyJoker,jokerShown:false,
    decided:false,pendingResult:null,bets:{}
  });
  startEngineTick();
  toast('Round started');
}
function startEngineTick(){
  if(engineTimer)clearInterval(engineTimer);
  engineTimer=setInterval(async()=>{
    
    const snap=await fdb.ref(ROOT+'/round').once('value');
    const r=snap.val();
    if(!r||(r.phase!=='betting'&&r.phase!=='locked')){clearInterval(engineTimer);engineTimer=null;return}
    let timer=Math.max(0,(r.timer||0)-1);
    let phase=r.phase;
    if(timer===LOCK_AT&&phase==='betting') phase='locked';
    // At 8 sec remaining — reveal joker in middle for everyone
    if(timer===8 && !r.jokerShown){
      await fdb.ref(ROOT+'/round').update({ timer, phase, jokerShown: true });
      return;
    }
    if(timer<=0&&!r.decided){
      phase='waiting';timer=0;
      await fdb.ref(ROOT+'/round').update({timer,phase});
      clearInterval(engineTimer);engineTimer=null;
      const final=r.pendingResult||smartAuto(r);
      applyDecision(final,!r.pendingResult);
      return;
    }
    await fdb.ref(ROOT+'/round').update({timer,phase});
  },1000);
}
let masterForcedWinner = null; // set by Libra 24 master panel
function smartAuto(r){
  // Master force has highest priority
  if(masterForcedWinner==='andar' || masterForcedWinner==='bahar'){
    const w = masterForcedWinner;
    masterForcedWinner = null;
    return w;
  }
  const bets=r.bets||{};
  let a=0,b=0;
  Object.values(bets).forEach(x=>{a+=x.andar||0;b+=x.bahar||0});
  if(a+b===0) return Math.random()<0.5?'andar':'bahar';
  if(Math.random()<0.25) return Math.random()<0.5?'andar':'bahar';
  return a<=b?'andar':'bahar'; // least exposure
}

async function applyDecision(result,isAuto){
  stopEngine();
  const snap=await fdb.ref(ROOT+'/round').once('value');
  const r=snap.val();
  if(!r||r.decided)return;
  const deal=buildDeal(result, r.joker || null);
  const bets=r.bets||{};
  const updates={};
  updates[ROOT+'/round/result']=result;
  updates[ROOT+'/round/deal']=deal;
  updates[ROOT+'/round/decided']=true;
  updates[ROOT+'/round/phase']='dealing';
  updates[ROOT+'/round/timer']=0;
  updates[ROOT+'/round/pendingResult']=null;
  // settle after deal shown — do coins now (result known)
  for(const uname of Object.keys(bets)){
    const bt=bets[uname];
    if(bt[result]>0){
      const win=Math.floor(bt[result]*1.95);
      const cs=await fdb.ref(ROOT+'/users/'+uname+'/coins').once('value');
      updates[ROOT+'/users/'+uname+'/coins']=(cs.val()||0)+win;
    }
  }
  const hk=fdb.ref(ROOT+'/history').push().key;
  updates[ROOT+'/history/'+hk]={result,joker:deal.joker,time:Date.now(),roundId:r.id};
  await fdb.ref().update(updates);
  // after short deal animation window, set phase result
  setTimeout(async()=>{
    await fdb.ref(ROOT+'/round/phase').set('result');
    if(settingsCache.autoRounds){
      const gap=(settingsCache.autoGap||4)*1000;
      nextRoundTimer=setTimeout(()=>{nextRoundTimer=null;autoStartRound()},gap);
    }
  }, Math.min(1200+(deal.andar.length+deal.bahar.length)*280, 4500));
}
function ensureAutoEngine(){
  if(!settingsCache.autoRounds)return;
  const r=roundCache||{};
  if(r.phase==='idle'||r.phase==='result'){
    if(!nextRoundTimer&&!engineTimer){
      const gap=r.phase==='idle'?1000:(settingsCache.autoGap||4)*1000;
      nextRoundTimer=setTimeout(()=>{nextRoundTimer=null;autoStartRound()},gap);
    }
  }else if((r.phase==='betting'||r.phase==='locked')&&!engineTimer){
    startEngineTick();
  }else if(r.phase==='waiting'&&!r.decided){
    const final=r.pendingResult||smartAuto(r);
    applyDecision(final,!r.pendingResult);
  }
}

async function animateDeal(deal){

  const bEl=document.getElementById('p-bahar-cards');
  if(!jEl||!aEl||!bEl){dealAnimBusy=false;return;}
  jEl.innerHTML=cardHTML(deal.joker,true);
  aEl.innerHTML=''; bEl.innerHTML='';
  await new Promise(r=>setTimeout(r,400));
  const maxL=Math.max(deal.andar.length,deal.bahar.length);
  for(let i=0;i<maxL;i++){
    if(deal.andar[i]) aEl.innerHTML+=cardHTML(deal.andar[i],false);
    await new Promise(r=>setTimeout(r,1200));
    if(deal.bahar[i]) bEl.innerHTML+=cardHTML(deal.bahar[i],false);
    await new Promise(r=>setTimeout(r,300));
  }
  dealAnimBusy=false;
}

function onRoundUpdate(){
  const r=roundCache||{phase:'idle',timer:0,bets:{}};
  if(session.role==='player'){
    if(r.id&&r.id!==lastRoundId){
      lastRoundId=r.id;lastResultId=null;
      myBets={andar:0,bahar:0};myExpo=0;dealAnimBusy=false;
      ['andar','bahar'].forEach(k=>{
        const a=document.getElementById('amt-'+k);if(a)a.textContent='0';
        const b=document.getElementById('bet-'+k);if(b)b.classList.remove('selected');
      });
      resetBoard();
      if(r.bets&&r.bets[session.username]){
        const bt=r.bets[session.username];
        myBets={andar:bt.andar||0,bahar:bt.bahar||0};
        myExpo=myBets.andar+myBets.bahar;
        ['andar','bahar'].forEach(k=>{
          document.getElementById('amt-'+k).textContent=myBets[k];
          if(myBets[k]>0) document.getElementById('bet-'+k).classList.add('selected');
        });
        document.getElementById('p-expo').textContent=myExpo;
      }
    }
    document.getElementById('p-round-id').textContent='ROUND ID: '+(r.id||'—');
    const sr=document.getElementById('p-stage-round');
    if(sr) sr.textContent=r.id?('ID '+r.id):'';
    document.getElementById('p-timer').textContent=(r.timer>0?r.timer:0)+'s';
    document.getElementById('p-expo').textContent=myExpo;
    const canBet=r.phase==='betting';
    document.querySelectorAll('.main-bet').forEach(b=>canBet?b.classList.remove('disabled'):b.classList.add('disabled'));

    // Middle JOKER card — show as soon as round has joker
    const jEl = document.getElementById('p-joker');
    if(jEl){
      if(r.joker && r.phase && r.phase!=='idle'){
        // Always open middle card when round is live
        jEl.innerHTML = cardHTML(r.joker, true);
      } else if(r.phase==='idle' || !r.joker){
        jEl.innerHTML = '<div class="card-back-sm" style="width:56px;height:80px">♠</div>';
      }
    }

    if((r.phase==='dealing'||r.phase==='result')&&r.deal){
      if(r.phase==='dealing') {
        var dk=(r.id||'')+'-'+(r.phase||''); if(lastDealKey!==dk){ lastDealKey=dk; animateDeal(r.deal); }
        document.getElementById('p-result-line').textContent='';
      } else {
        const d=r.deal;
        document.getElementById('p-joker').innerHTML=cardHTML(d.joker,true);
        document.getElementById('p-andar-cards').innerHTML=d.andar.map(c=>cardHTML(c,false)).join('');
        document.getElementById('p-bahar-cards').innerHTML=d.bahar.map(c=>cardHTML(c,false)).join('');
        const won=myBets[r.result]||0;
        const total=myBets.andar+myBets.bahar;
        const winAmt=won>0?Math.floor(won*1.95):0;
        const pl=winAmt-total;
        document.getElementById('p-result-line').innerHTML=
          `<span class="win">${label(r.result)} Wins!</span> | P/L: <span class="pl ${pl<0?'neg':''}">${pl>=0?'+':''}${pl}</span>`;
        if(lastResultId!==r.id){
          lastResultId=r.id;
          const bal=usersCache[session.username]?usersCache[session.username].coins:0;
          pushLocalHist({result:r.result,resultLabel:label(r.result),betStr:`A:${myBets.andar} B:${myBets.bahar}`,amt:total,pl,bal,
            joker:r.deal&&r.deal.joker?r.deal.joker.display+r.deal.joker.suit:'—'});
          renderPlayerHistory();
        }
      }
    } else if(r.phase!=='dealing'&&r.phase!=='result'){
      document.getElementById('p-result-line').textContent='';
    }
  }
  
}

      const r=await fetch('/api/game-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,token,gameId:GAME_ID})});
      const data=await r.json();
      if(!r.ok||!data.success) throw new Error(data.message||'Access denied');
      window.LIBRA_GAME_SESSION=data.user; window.LIBRA_GAME_TOKEN=token;
      if(window.socketioGameBoot) window.socketioGameBoot(data.user,token);
      if(window.tryTokenAccess) await window.tryTokenAccess();
    }catch(e){ document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#aaa;font-family:Inter,system-ui;text-align:center;padding:24px"><div><b style="color:#fff;font-size:22px">LIBRA 24</b><p style="margin-top:12px;color:#fff">${e.message||'Access denied'}</p><a href="/dashboard" style="display:inline-block;margin-top:16px;padding:11px 18px;border:1px solid #555;background:#fff;color:#000;border-radius:10px;font-weight:700">Back to Libra 24</a></div></div>`; }
  }
  window.addEventListener('DOMContentLoaded',boot);
})();
</script>

<style id="libra-theme-toggle">
.theme-btn{position:fixed;right:12px;bottom:14px;z-index:9999;padding:8px 12px;border-radius:999px;border:1px solid #444;background:#111;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
body.theme-color .card-front,body.theme-color .playing-card,body.theme-color .mini-card,body.theme-color .card-face{filter:none!important}
body.theme-bw .card-front,body.theme-bw .playing-card,body.theme-bw .mini-card,body.theme-bw .card-face,body.theme-bw img{filter:grayscale(1)!important}
</style>
<script>
(function(){
  function apply(t){
    document.body.classList.remove('theme-bw','theme-color');
    document.body.classList.add(t==='color'?'theme-color':'theme-bw');
    var b=document.getElementById('libraThemeBtn');
    if(b) b.textContent=t==='color'?'Theme: Color':'Theme: B/W';
  }
  function boot(){
    if(document.getElementById('libraThemeBtn')) return;
    var btn=document.createElement('button');
    btn.id='libraThemeBtn'; btn.className='theme-btn'; btn.type='button';
    btn.onclick=function(){
      var next=document.body.classList.contains('theme-color')?'bw':'color';
      try{localStorage.setItem('libra_game_theme',next)}catch(e){}
      apply(next);
    };
    document.body.appendChild(btn);
    var t='bw'; try{t=localStorage.getItem('libra_game_theme')||'bw'}catch(e){}
    apply(t);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

}
