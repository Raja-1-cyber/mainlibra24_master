const SUITS=[{s:'♠',c:'black'},{s:'♥',c:'red'},{s:'♦',c:'red'},{s:'♣',c:'black'}];
function mkCard(rank,suitObj){
  const display=rank===1?'A':rank===11?'J':rank===12?'Q':rank===13?'K':String(rank);

function randCard(excludeRanks){

    r=1+Math.floor(Math.random()*13);

    tries++;
  }while(excludeRanks&&excludeRanks.includes(r)&&tries<40);
  return mkCard(r,s);
}

// Teen Patti rank: higher score = stronger
// category: 6 trail, 5 pure seq, 4 seq, 3 color, 2 pair, 1 high
function handScore(cards){
  const ranks=cards.map(c=>c.rank).sort((a,b)=>a-b);
  const suits=cards.map(c=>c.suit);
  const sameSuit=suits[0]===suits[1]&&suits[1]===suits[2];

  // sequence: A-2-3 is valid pure/seq; A-K-Q is top

    // normal
    if(rr[2]-rr[1]===1&&rr[1]-rr[0]===1) return true;
    // A-2-3
    if(rr[0]===1&&rr[1]===2&&rr[2]===3) return true;

    if(rr[0]===1&&rr[1]===12&&rr[2]===13) return true;
    return false;
  }
  const seq=isSeq(ranks);
  const counts={};
  ranks.forEach(r=>counts[r]=(counts[r]||0)+1);
  const pairRank=Object.keys(counts).find(k=>counts[k]===2);
  const high=Math.max(...ranks.map(r=>r===1?14:r));

  let cat=1, tiebreak=[high];

    cat=5;
    // A-2-3 lowest pure seq
    if(ranks[0]===1&&ranks[1]===2&&ranks[2]===3) tiebreak=[3];
    else if(ranks[0]===1&&ranks[1]===12) tiebreak=[14];
    else tiebreak=[ranks[2]];
  } else if(seq){
    cat=4;
    if(ranks[0]===1&&ranks[1]===2&&ranks[2]===3) tiebreak=[3];
    else if(ranks[0]===1&&ranks[1]===12) tiebreak=[14];
    else tiebreak=[ranks[2]];
  } else if(sameSuit){
    cat=3;
    const rs=ranks.map(r=>r===1?14:r).sort((a,b)=>b-a);
    tiebreak=rs;
  } else if(pairRank){
    cat=2;
    const pr=parseInt(pairRank)===1?14:parseInt(pairRank);
    const kicker=ranks.filter(r=>r!==parseInt(pairRank)).map(r=>r===1?14:r)[0];
    tiebreak=[pr,kicker];
  } else {
    cat=1;
    tiebreak=ranks.map(r=>r===1?14:r).sort((a,b)=>b-a);
  }
  // pack into number
  let score=cat*1e10;
  tiebreak.forEach((v,i)=>{score+=v*Math.pow(100,4-i)});
  const names={6:'Trail',5:'Pure Sequence',4:'Sequence',3:'Colour',2:'Pair',1:'High Card'};
  return {score, name:names[cat], cat};
}

function compareHands(ha,hb){
  const sa=handScore(ha), sb=handScore(hb);
  if(sa.score>sb.score) return 1;
  if(sa.score<sb.score) return -1;
  return 0;
}

function isForbiddenTrail(cards){
  const ranks=cards.map(c=>c.rank);
  if(ranks[0]===ranks[1]&&ranks[1]===ranks[2]){
    if(ranks[0]===1||ranks[0]===13) return true; // no AAA or KKK
  }
  return false;
}

function randomHand(){
  let cards,tries=0;
  do{
    const used=[];
    cards=[];
    for(let i=0;i<3;i++){
      let c,t=0;
      do{c=randCard();t++}while(used.some(u=>u.rank===c.rank&&u.suit===c.suit)&&t<30);
      used.push(c);cards.push(c);
    }
    tries++;
  }while(isForbiddenTrail(cards)&&tries<25);
  return cards;
}

function buildHands(winner){
  // Generate mixed hands; winner has strictly better hand; no AAA/KKK
  for(let attempt=0;attempt<80;attempt++){
    let a=randomHand(), b=randomHand();
    if(isForbiddenTrail(a)||isForbiddenTrail(b)) continue;
    let cmp=compareHands(a,b);
    if(cmp===0) continue;
    if(winner==='a'&&cmp>0) return {a,b, handA:handScore(a).name, handB:handScore(b).name};
    if(winner==='b'&&cmp<0) return {a,b, handA:handScore(a).name, handB:handScore(b).name};
    if(winner==='a'&&cmp<0) return {a:b,b:a, handA:handScore(b).name, handB:handScore(a).name};
    if(winner==='b'&&cmp>0) return {a:b,b:a, handA:handScore(b).name, handB:handScore(a).name};
  }
  // fallback mixture pair vs high
  const a=[mkCard(10,SUITS[0]),mkCard(10,SUITS[1]),mkCard(5,SUITS[2])];
  const b=[mkCard(12,SUITS[0]),mkCard(8,SUITS[2]),mkCard(3,SUITS[3])];
  if(winner==='a') return {a,b,handA:'Pair',handB:'High Card'};
  return {a:b,b:a,handA:'High Card',handB:'Pair'};
}

function stopEngine(){if(engineTimer){clearInterval(engineTimer);engineTimer=null}if(nextRoundTimer){clearTimeout(nextRoundTimer);nextRoundTimer=null}}
async function autoStartRound(){
  const r=roundCache||{};
  if(['betting','locked','waiting','dealing'].includes(r.phase)){toast('Round running');return}
  stopEngine();
  const rid=Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*999);
  await fdb.ref(ROOT+'/round').set({id:rid,phase:'betting',timer:BET_WINDOW,result:null,hands:null,decided:false,pendingResult:null,bets:{}});
  startEngineTick();toast('Round started');
}
function startEngineTick(){
  if(engineTimer)clearInterval(engineTimer);
  engineTimer=setInterval(async()=>{
    
    const r=(await fdb.ref(ROOT+'/round').once('value')).val();
    if(!r||(r.phase!=='betting'&&r.phase!=='locked')){clearInterval(engineTimer);engineTimer=null;return}
    let timer=Math.max(0,(r.timer||0)-1), phase=r.phase;
    if(timer===LOCK_AT&&phase==='betting') phase='locked';
    if(timer<=0&&!r.decided){
      await fdb.ref(ROOT+'/round').update({timer:0,phase:'waiting'});
      clearInterval(engineTimer);engineTimer=null;
      applyDecision(r.pendingResult||smartAuto(r),!r.pendingResult);
      return;
    }
    await fdb.ref(ROOT+'/round').update({timer,phase});
  },1000);
}
let masterForcedWinner = null;
function smartAuto(r){
  if(masterForcedWinner==='a' || masterForcedWinner==='b'){
    const w = masterForcedWinner; masterForcedWinner = null; return w;
  }
  const bets=r.bets||{};let a=0,b=0;
  Object.values(bets).forEach(x=>{a+=x.a||0;b+=x.b||0});
  if(a+b===0) return Math.random()<0.5?'a':'b';
  if(Math.random()<0.25) return Math.random()<0.5?'a':'b';
  return a<=b?'a':'b';
}

async function applyDecision(result,isAuto){
  /* LIBRA_APPLY_GUARD */
  stopEngine();
  try{
  const r=(await fdb.ref(ROOT+'/round').once('value')).val();
  if(!r||r.decided)return;
  const hands=buildHands(result);
  const updates={};
  updates[ROOT+'/round/result']=result;
  updates[ROOT+'/round/hands']=hands;
  updates[ROOT+'/round/decided']=true;
  updates[ROOT+'/round/phase']='dealing';
  updates[ROOT+'/round/timer']=0;
  updates[ROOT+'/round/pendingResult']=null;
  const bets=r.bets||{};
  for(const uname of Object.keys(bets)){
    const bt=bets[uname];
    if(bt[result]>0){
      const win=Math.floor(bt[result]*1.95);
      const cs=(await fdb.ref(ROOT+'/users/'+uname+'/coins').once('value')).val()||0;
      updates[ROOT+'/users/'+uname+'/coins']=cs+win;
    }
  }
  const hk=fdb.ref(ROOT+'/history').push().key;
  updates[ROOT+'/history/'+hk]={result,handA:hands.handA,handB:hands.handB,time:Date.now(),roundId:r.id};
  await fdb.ref().update(updates);
  // 6 card flips ~ 6*320ms
  setTimeout(async()=>{
    try{
      await fdb.ref(ROOT+'/round/phase').set('result');
      if(settingsCache.autoRounds){
        nextRoundTimer=setTimeout(()=>{nextRoundTimer=null;autoStartRound()},(settingsCache.autoGap||4)*1000);
      }
    }catch(e){ console.error(e); try{autoStartRound()}catch(_e){} }
  }, 2200);
  }catch(e){
    console.error("applyDecision failed",e);
    try{
      fdb.ref(ROOT+"/round").update({phase:"result",decided:true,timer:0});
      setTimeout(function(){try{autoStartRound()}catch(_e){}},2000);
    }catch(_e){}
  }
}
function ensureAutoEngine(){
  if(!settingsCache.autoRounds)return;
  const r=roundCache||{};
  if(r.phase==='idle'||r.phase==='result'){
    if(!nextRoundTimer&&!engineTimer){
      const gap=r.phase==='idle'?1000:(settingsCache.autoGap||4)*1000;
      nextRoundTimer=setTimeout(()=>{nextRoundTimer=null;autoStartRound()},gap);
    }
  }else if((r.phase==='betting'||r.phase==='locked')&&!engineTimer) startEngineTick();
  else if(r.phase==='waiting'&&!r.decided) applyDecision(r.pendingResult||smartAuto(r),!r.pendingResult);
}

async function animateDeal(hands){
  if(!hands||dealAnimBusy)return;
  dealAnimBusy=true;
  const aEl=document.getElementById('p-cards-a'), bEl=document.getElementById('p-cards-b');
  if(!aEl||!bEl){dealAnimBusy=false;return;}
  aEl.innerHTML=backs3(); bEl.innerHTML=backs3();
  const ha=document.getElementById('p-hand-a'), hb=document.getElementById('p-hand-b');
  if(ha) ha.textContent='';
  if(hb) hb.textContent='';
  // Sequence: A1 → 2s → B1 → 2s → A2 → 2s → B2 → 2s → A3 → 2s → B3
  const order=[['a',0],['b',0],['a',1],['b',1],['a',2],['b',2]];
  const shownA=['','',''], shownB=['','',''];
  for(let i=0;i<order.length;i++){
    if(i>0) await new Promise(r=>setTimeout(r,2000));
    const [side,idx]=order[i];
    if(side==='a'){
      shownA[idx]=cardHTML(hands.a[idx]);
      aEl.innerHTML=shownA.map((x,j)=>x||'<div class="card-back-sm">♠</div>').join('');
    }else{
      shownB[idx]=cardHTML(hands.b[idx]);
      bEl.innerHTML=shownB.map((x,j)=>x||'<div class="card-back-sm">♠</div>').join('');
    }
  }
  dealAnimBusy=false;
}

  if(session.role==='player'){
    if(r.id&&r.id!==lastRoundId){
      lastRoundId=r.id;lastResultId=null;dealAnimBusy=false;
      myBets={a:0,b:0};myExpo=0;
      ['a','b'].forEach(k=>{document.getElementById('amt-'+k).textContent='0';document.getElementById('bet-'+k).classList.remove('selected')});
      document.getElementById('p-cards-a').innerHTML=backs3();
      document.getElementById('p-cards-b').innerHTML=backs3();
      document.getElementById('p-hand-a').textContent='';
      document.getElementById('p-hand-b').textContent='';
      document.getElementById('p-result-line').textContent='';
      if(r.bets&&r.bets[session.username]){
        const bt=r.bets[session.username];
        myBets={a:bt.a||0,b:bt.b||0};myExpo=myBets.a+myBets.b;
        ['a','b'].forEach(k=>{document.getElementById('amt-'+k).textContent=myBets[k];if(myBets[k]>0)document.getElementById('bet-'+k).classList.add('selected')});
        document.getElementById('p-expo').textContent=myExpo;
      }

    document.getElementById('p-round-id').textContent='ROUND ID: '+(r.id||'—');
    const sr=document.getElementById('p-stage-round');if(sr) sr.textContent=r.id?('ID '+r.id):'';
    document.getElementById('p-timer').textContent=(r.timer>0?r.timer:0)+'s';
    document.getElementById('p-expo').textContent=myExpo;
    const canBet=r.phase==='betting';
    document.querySelectorAll('.main-bet').forEach(b=>canBet?b.classList.remove('disabled'):b.classList.add('disabled'));

    if((r.phase==='dealing'||r.phase==='result')&&r.hands){
      if(r.phase==='dealing'){
        animateDeal(r.hands);
        document.getElementById('p-result-line').textContent='';
        document.getElementById('p-hand-a').textContent='';
        document.getElementById('p-hand-b').textContent='';
      }else{
        const h=r.hands||{a:[],b:[]};
        const ha=Array.isArray(h.a)?h.a:[];
        const hb=Array.isArray(h.b)?h.b:[];
        const elA=document.getElementById('p-cards-a');
        const elB=document.getElementById('p-cards-b');
        if(elA) elA.innerHTML=ha.map(c=>cardHTML(c)).join('');
        if(elB) elB.innerHTML=hb.map(c=>cardHTML(c)).join('');

        const hbEl=document.getElementById('p-hand-b');
        if(haEl) haEl.textContent=h.handA||'';
        if(hbEl) hbEl.textContent=h.handB||'';
        const won=myBets[r.result]||0;
        const total=myBets.a+myBets.b;
        const winAmt=won>0?Math.floor(won*1.95):0;
        const pl=winAmt-total;
        document.getElementById('p-result-line').innerHTML=
          `<span class="win">${label(r.result)} Wins!</span> | P/L: <span class="pl ${pl<0?'neg':''}">${pl>=0?'+':''}${pl}</span>`;
        if(lastResultId!==r.id){
          lastResultId=r.id;
          const bal=usersCache[session.username]?usersCache[session.username].coins:0;
          pushLocalHist({result:r.result,resultLabel:label(r.result),betStr:`A:${myBets.a} B:${myBets.b}`,amt:total,pl,bal,handA:h.handA,handB:h.handB});
          if(lastLibraSyncId!==r.id){ lastLibraSyncId=r.id; if(winAmt>0) libraWallet(winAmt,'win_'+r.result); }
          renderPlayerHistory();
        }
      }
    }else if(r.phase!=='dealing'&&r.phase!=='result'){
      document.getElementById('p-result-line').textContent='';
    }
  }
  
}

    if(!token||!username){ document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#aaa;font-family:Inter,system-ui;text-align:center;padding:24px"><div><b style="color:#fff;font-size:22px">LIBRA 24</b><p style="margin-top:12px">Open this game from your Libra 24 dashboard.</p></div></div>`; return; }
    try{
      const r=await fetch('/api/game-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,token,gameId:GAME_ID})});
      const data=await r.json();
      if(!r.ok||!data.success) throw new Error(data.message||'Access denied');
      window.LIBRA_GAME_SESSION=data.user; window.LIBRA_GAME_TOKEN=token;
      if(window.socketioGameBoot) window.socketioGameBoot(data.user,token);
      if(window.tryTokenAccess) await window.tryTokenAccess();
    }catch(e){ document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;background:#050505;color:#aaa;font-family:Inter,system-ui;text-align:center;padding:24px"><div><b style="color:#fff;font-size:22px">LIBRA 24</b><p style="margin-top:12px;color:#fff">${e.message||'Access denied'}</p><a href="/dashboard" style="display:inline-block;margin-top:16px;padding:11px 18px;border:1px solid #555;background:#fff;color:#000;border-radius:10px;font-weight:700">Back to Libra 24</a></div></div>`; }
  }
  window.addEventListener('DOMContentLoaded',boot);
})();
</script>

<script>
(function(){
  function apply(t){
    document.body.classList.remove('theme-bw','theme-color');
    document.body.classList.add(t==='color'?'theme-color':'theme-bw');
    var b=document.getElementById('libraThemeBtn');
    if(b) b.textContent=t==='color'?'Theme: Color':'Theme: B/W';
  }
  function boot(){
    if(document.getElementById('libraThemeBtn')) return;
    var btn=document.createElement('button');
    btn.id='libraThemeBtn'; btn.className='theme-btn'; btn.type='button';
    btn.onclick=function(){
      var next=document.body.classList.contains('theme-color')?'bw':'color';
      try{localStorage.setItem('libra_game_theme',next)}catch(e){}
      apply(next);
    };
    document.body.appendChild(btn);
    var t='bw'; try{t=localStorage.getItem('libra_game_theme')||'bw'}catch(e){}
    apply(t);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

<script>
/* ===== LIBRA LOCAL ENGINE v2 (Teen Patti) — sequential cards, no crash ===== */
(function(){
  if(window.__libraLocalV2) return;
  window.__libraLocalV2 = true;
  window.__localOwnsRound = true;

  var localTimer=null, localBusy=false, animBusy=false, localRoundId=null;

  window.__setForce = function(w){
    if(!w){ window.masterForcedWinner=null; return; }
    var s=String(w).toLowerCase();
    if(s==='a'||s==='player a'||s==='teama') window.masterForcedWinner='a';
    else if(s==='b'||s==='player b'||s==='teamb') window.masterForcedWinner='b';
    else window.masterForcedWinner=s;
    console.log('[TP] force set', window.masterForcedWinner);
  };

  function setRound(partial){
    roundCache = Object.assign({}, roundCache||{}, partial);
    try{ onRoundUpdate(); }catch(e){ console.warn(e); }
  }
  function stopLocal(){ if(localTimer){ clearInterval(localTimer); localTimer=null; } }

  window.stopEngine = function(){
    stopLocal();
    try{ if(typeof engineTimer!=='undefined'&&engineTimer){ clearInterval(engineTimer); engineTimer=null; } }catch(e){}
    try{ if(typeof nextRoundTimer!=='undefined'&&nextRoundTimer){ clearTimeout(nextRoundTimer); nextRoundTimer=null; } }catch(e){}
  };

  var _origBoot = window.socketioGameBoot;
  window.socketioGameBoot = function(user, token){
    try{ if(_origBoot) _origBoot(user, token); }catch(e){}
    try{
      var so = window.__l24socket || (window.__l24socket = io());
      so.on('master_force_result', function(d){
        if(d && d.gameId==='teenpatti') window.__setForce(d.winner);
      });
      so.on('live_game_update', function(g){
        if(g && g.id==='teenpatti' && g.forcedWinner) window.__setForce(g.forcedWinner);
      });
    }catch(e){}
  };

  function clearBoard(){
    try{
      var a=document.getElementById('p-cards-a'); if(a) a.innerHTML='';
      var b=document.getElementById('p-cards-b'); if(b) b.innerHTML='';
      var ha=document.getElementById('p-hand-a'); if(ha) ha.textContent='';
      var hb=document.getElementById('p-hand-b'); if(hb) hb.textContent='';
      var rl=document.getElementById('p-result-line'); if(rl) rl.textContent='';
    }catch(e){}
  }

  window.autoStartRound = async function(){
    if(localBusy||animBusy) return;
    window.stopEngine();
    localRoundId = 'TP-'+Date.now().toString(36).toUpperCase();
    clearBoard();
    setRound({
      id: localRoundId, phase:'betting', timer:10,
      result:null, hands:null, decided:false, pendingResult:null, bets:{}
    });
    try{ if(typeof myBets!=='undefined'){ myBets={a:0,b:0}; myExpo=0;
      var aa=document.getElementById('amt-a'); if(aa) aa.textContent='0';
      var ab=document.getElementById('amt-b'); if(ab) ab.textContent='0';
      var ba=document.getElementById('bet-a'); if(ba) ba.classList.remove('selected');
      var bb=document.getElementById('bet-b'); if(bb) bb.classList.remove('selected');
      var ex=document.getElementById('p-expo'); if(ex) ex.textContent='0';
    } }catch(e){}
    startLocalTick();
  };

  function startLocalTick(){
    stopLocal();
    localTimer=setInterval(function(){
      try{
        if(animBusy) return;
        var r=roundCache||{};
        if(r.phase!=='betting'&&r.phase!=='locked'){ stopLocal(); return; }
        var timer=Math.max(0,(Number(r.timer)||0)-1);
        var phase=r.phase;
        if(timer===4 && phase==='betting') phase='locked';
        if(timer<=0){
          stopLocal();
          setRound({timer:0, phase:'waiting'});
          var w=null;
          if(window.masterForcedWinner){ w=window.masterForcedWinner; window.masterForcedWinner=null; }
          else if(typeof smartAuto==='function'){ try{ w=smartAuto(r); }catch(e){} }
          if(w==='A') w='a'; if(w==='B') w='b';
          if(w!=='a'&&w!=='b') w = Math.random()<0.5?'a':'b';
          finishLocal(w);
          return;
        }
        setRound({timer:timer, phase:phase});
      }catch(e){ console.error('TP tick',e); }
    },1000);
  }

  function cardHtmlSafe(c){
    try{ return (typeof cardHTML==='function') ? cardHTML(c) : '<div class="card">?</div>'; }catch(e){ return ''; }
  }

  function animateHands(hands){
    return new Promise(function(resolve){
      animBusy=true;
      var aEl=document.getElementById('p-cards-a');
      var bEl=document.getElementById('p-cards-b');
      if(aEl) aEl.innerHTML='';
      if(bEl) bEl.innerHTML='';
      var ha=Array.isArray(hands&&hands.a)?hands.a:[];
      var hb=Array.isArray(hands&&hands.b)?hands.b:[];
      var shownA=['','',''], shownB=['','',''];
      var step=0;
      function next(){
        try{
          if(step<3){
            if(ha[step] && aEl){ shownA[step]=cardHtmlSafe(ha[step]); aEl.innerHTML=shownA.join(''); }
            step++;
            setTimeout(next, 350);
            return;
          }
          if(step<6){
            var i=step-3;
            if(hb[i] && bEl){ shownB[i]=cardHtmlSafe(hb[i]); bEl.innerHTML=shownB.join(''); }
            step++;
            setTimeout(next, 350);
            return;
          }
          // labels
          var haEl=document.getElementById('p-hand-a'); if(haEl) haEl.textContent=(hands&&hands.handA)||'';
          var hbEl=document.getElementById('p-hand-b'); if(hbEl) hbEl.textContent=(hands&&hands.handB)||'';
          animBusy=false;
          resolve();
        }catch(e){ console.error(e); animBusy=false; resolve(); }
      }
      setTimeout(next, 200);
    });
  }

  async function finishLocal(winner){
    if(localBusy) return;
    localBusy=true;
    try{
      if(winner==='A') winner='a'; if(winner==='B') winner='b';
      if(winner!=='a'&&winner!=='b') winner='a';
      var hands = (typeof buildHands==='function') ? buildHands(winner) : {a:[],b:[],handA:'',handB:''};
      // dealing phase WITHOUT exposing hands to onRoundUpdate race — keep hands null until anim done
      setRound({ result:null, hands:null, decided:true, phase:'dealing', timer:0 });
      await animateHands(hands);
      setRound({ result:winner, hands:hands, decided:true, phase:'result', timer:0 });
      try{
        var so=window.__l24socket;
        if(so) so.emit('game_result_report',{gameId:'teenpatti', roundId:localRoundId, winner: winner==='a'?'A':'B'});
      }catch(e){}
      localBusy=false;
      setTimeout(function(){ try{ window.autoStartRound(); }catch(e){} }, 4500);
    }catch(e){
      console.error('TP finish',e);
      localBusy=false; animBusy=false;
      setTimeout(function(){ try{ window.autoStartRound(); }catch(e){} }, 2500);
    }
  }

  window.ensureAutoEngine = function(){
    if(animBusy||localBusy) return;
    var r=roundCache||{}, ph=r.phase||'idle';
    if(ph==='idle'||ph==='result'||!ph){ if(!localTimer) window.autoStartRound(); }
    else if((ph==='betting'||ph==='locked')&&!localTimer) startLocalTick();
    else if(ph==='waiting'&&!r.decided){
      var w=window.masterForcedWinner||'a'; window.masterForcedWinner=null; finishLocal(w);
    }
  };

  // Disconnect firebase round listener to prevent mid-round overwrites
  try{
    if(typeof fdb!=='undefined' && typeof ROOT!=='undefined'){
      fdb.ref(ROOT+'/round').off();
    }
  }catch(e){}

  // Safer onRoundUpdate: during dealing don't force-show hands from partial state
  var _origOnRound = window.onRoundUpdate;
  // can't easily wrap if not on window — patch by leaving phase dealing with hands null

  setTimeout(function(){ window.ensureAutoEngine(); }, 1000);
  setInterval(function(){ try{ window.ensureAutoEngine(); }catch(e){} }, 7000);
})();
</script>
