<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20-20 Dragon Tiger - LIBRA 24</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
    }
    .top-bar {
      background: #111;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    .logo { font-weight: bold; color: #fbbf24; }
    .user-info { font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .logout-btn {
      background: #ef4444; color: white; border: none;
      padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    .balance-bar {
      background: linear-gradient(90deg, #facc15, #eab308);
      padding: 10px;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
      font-size: 15px;
      color: #000;
    }
    .coins { color: #166534; }
    .expo { color: #dc2626; }
    .game-header {
      background: #1a1a1a;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      border-bottom: 1px solid #333;
    }
    .cards-area {
      background: #000;
      height: 220px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cards-container {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .card-back, .card-front {
      width: 70px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .card-back {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border: 2px solid #60a5fa;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px);
    }
    .card-front {
      background: white;
      color: black;
      font-size: 22px;
      font-weight: bold;
      flex-direction: column;
      line-height: 1.15;
      padding: 4px;
      text-align: center;
    }
    .card-front .suit-red { color: #dc2626; }
    .card-front .suit-black { color: #111; }
    .card-front .rank-line { font-size: 18px; }
    .card-front .suit-line { font-size: 24px; }
    .card-flip-wrap {
      width: 70px; height: 100px; perspective: 900px;
    }
    .card-flip-inner {
      width: 100%; height: 100%; position: relative;
      transition: transform 0.7s cubic-bezier(.4,.2,.2,1);
      transform-style: preserve-3d;
    }
    .card-flip-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .card-face.back {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      border: 2px solid #60a5fa;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.1) 5px, rgba(255,255,255,0.1) 10px);
      color: #fff; font-size: 12px; font-weight: 800;
    }
    .card-face.front {
      background: #fff; color: #000; flex-direction: column;
      transform: rotateY(180deg); font-weight: bold; padding: 4px; text-align: center;
    }
    body.theme-color .card-front .suit-red, body.theme-color .card-face.front .suit-red { color: #dc2626 !important; }
    body.theme-color .card-front, body.theme-color .card-face.front, body.theme-color .card-back, body.theme-color .card-face.back { filter: none !important; }
    body.theme-bw .card-front, body.theme-bw .card-face.front, body.theme-bw .card-back, body.theme-bw .card-face.back { filter: grayscale(1) !important; }
    .theme-btn {
      position: fixed; right: 12px; bottom: 14px; z-index: 50;
      padding: 8px 12px; border-radius: 999px; border: 1px solid #444;
      background: #111; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .card-label {
      text-align: center;
      font-size: 11px;
      margin-top: 4px;
      color: #ccc;
      z-index: 5;
    }
    .spinner {
      position: absolute;
      width: 40px; height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #fbbf24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 10;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .timer-box {
      text-align: center;
      padding: 8px;
      background: #111;
      font-size: 28px;
      font-weight: bold;
      color: #fbbf24;
    }
    .bet-section { background: #1e293b; padding: 12px; }
    .main-bets { display: flex; gap: 8px; margin-bottom: 15px; }
    .main-bet-btn {
      flex: 1; padding: 14px 8px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 15px; cursor: pointer; color: white;
    }
    .dragon-btn { background: #1e40af; }
    .tie-btn { background: #374151; }
    .tiger-btn { background: #166534; }
    .odds { font-size: 12px; opacity: 0.9; display: block; margin-bottom: 4px; }
    .specific-bets {
      background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 10px;
    }
    .specific-title {
      text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 8px;
    }
    .card-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .card-bet {
      background: white; color: black; border-radius: 6px;
      padding: 6px 2px; text-align: center; font-size: 14px;
      font-weight: bold; cursor: pointer; border: 2px solid transparent;
    }
    .card-bet.selected { border-color: #fbbf24; background: #fef3c7; }
    .card-bet small { display: block; font-size: 10px; color: #666; }
    .last-result {
      background: #111; padding: 10px;
      display: flex; align-items: center; gap: 8px; overflow-x: auto;
    }
    .last-result-title { font-size: 12px; color: #94a3b8; white-space: nowrap; }
    .result-circle {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; flex-shrink: 0;
    }
    .d-circle { background: #7c3aed; }
    .t-circle { background: #dc2626; }
    .history-section {
      margin: 15px; background: #1e293b; border-radius: 12px;
      padding: 12px; overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid #334155; text-align: center; }
    th { background: #0f172a; color: #94a3b8; }
    .win { color: #22c55e; font-weight: bold; }
    .loss { color: #ef4444; font-weight: bold; }
    .status {
      text-align: center; padding: 8px; font-size: 14px; background: #111;
    }
  
    .chip-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 0 4px}
    .chip-btn{min-width:56px;padding:10px 12px;border-radius:999px;border:2px solid #475569;background:#0f172a;color:#e2e8f0;font-weight:800;font-size:13px;cursor:pointer}
    .chip-btn.active{border-color:#fbbf24;background:#422006;color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.25)}
    .ctrl-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 10px 0}
    .ctrl-btn{padding:10px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:13px}
    .ctrl-start{background:linear-gradient(90deg,#facc15,#eab308);color:#000}
    .ctrl-auto{background:#1e293b;color:#e2e8f0;border:1px solid #334155}

  
    /* ===== MOBILE FRIENDLY ===== */
    @media (max-width: 600px) {
      body { font-size: 12px !important; }
      .top-bar { padding: 6px 8px !important; gap: 6px !important; flex-wrap: wrap; }
      .logo { font-size: 14px !important; }
      .balance-bar { font-size: 11px !important; padding: 4px 8px !important; }
      .game-header { font-size: 11px !important; padding: 6px 8px !important; }
      .cards-area { min-height: 140px !important; padding: 8px !important; }
      .card-flip-wrap, .card-back, .card-front { width: 52px !important; height: 74px !important; }
      .card-face { font-size: 10px !important; }
      .card-face.front { font-size: 14px !important; }
      .card-label { font-size: 9px !important; }
      .cards-container { gap: 18px !important; }
      .timer-box { font-size: 18px !important; }
      .status { font-size: 12px !important; padding: 4px !important; }
      .bet-section { padding: 8px !important; }
      .bet-btn, .chip-btn, .card-bet { font-size: 11px !important; padding: 8px 10px !important; min-height: 36px; }
      .theme-btn { font-size: 10px !important; padding: 6px 10px !important; bottom: 10px; right: 8px; }
      table { font-size: 10px !important; }
      h3 { font-size: 13px !important; }
    }
    @media (max-width: 380px) {
      .card-flip-wrap, .card-back, .card-front { width: 44px !important; height: 64px !important; }
      .cards-container { gap: 12px !important; }
    }
</style>
<style>
body{background:#050505!important;color:#f5f5f5!important}.top-bar,.game-header,.history-section,.last-result{background:#0a0a0a!important;border-color:#292929!important}.balance-bar{background:#fff!important;color:#000!important}.logo{color:#fff!important}.coins{color:#000!important}.expo{color:#555!important}.card-bet,.chip-btn,.bet-btn{background:#111!important;color:#fff!important;border:1px solid #444!important}.card-bet.active,.chip-btn.active,.bet-btn:hover{background:#fff!important;color:#000!important}.card-front,.card-back{filter:grayscale(1)}table th{background:#111!important;color:#fff!important}h3{color:#fff!important}.win{color:#fff!important}.loss{color:#aaa!important}</style>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo">LIBRA 24</div>
    <div class="user-info">
      <span id="playerName">Player</span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- Balance -->
  <div class="balance-bar">
    <div>COINS: <span class="coins" id="coins">0</span></div>
    <div>EXPO: <span class="expo" id="expo">0</span></div>
    <div style="background:#22c55e;color:white;padding:2px 12px;border-radius:4px;">Bets</div>
  </div>

  <!-- Game Header -->
  <div class="game-header">
    <div>20-20 DRAGON TIGER</div>
    <div>ROUND ID: <span id="roundId">2E121...</span></div>
  </div>

  <!-- Cards Area -->
  <div class="cards-area" id="cardsArea">
    <div class="spinner" id="spinner"></div>
    <div class="cards-container" id="cardsContainer">
      <div>
        <div class="card-flip-wrap">
          <div class="card-flip-inner" id="dragonFlip">
            <div class="card-face back">DR</div>
            <div class="card-face front" id="dragonCard"></div>
          </div>
        </div>
        <div class="card-label">DRAGON</div>
      </div>
      <div>
        <div class="card-flip-wrap">
          <div class="card-flip-inner" id="tigerFlip">
            <div class="card-face back">TG</div>
            <div class="card-face front" id="tigerCard"></div>
          </div>
        </div>
        <div class="card-label">TIGER</div>
      </div>
    </div>
    <button type="button" class="theme-btn" id="themeBtn" onclick="toggleTheme()">Theme: B/W</button>
  </div>

  <!-- Timer -->
  <div class="timer-box">
    <span id="timer">20</span>s
  </div>
  <div class="status" id="status">Betting Time</div>
  <div id="resultBanner" style="display:none;text-align:center;padding:14px 12px;margin:8px 12px;border-radius:12px;font-weight:900;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#111;box-shadow:0 8px 24px rgba(251,191,36,.35);"></div>

  <!-- Main Bets -->
  <div class="bet-section">

    <div class="chip-bar">
      <button type="button" class="chip-btn active" data-v="100" onclick="selChip(this)">100</button>
      <button type="button" class="chip-btn" data-v="500" onclick="selChip(this)">500</button>
      <button type="button" class="chip-btn" data-v="1000" onclick="selChip(this)">1K</button>
      <button type="button" class="chip-btn" data-v="5000" onclick="selChip(this)">5K</button>
    </div>

    <div class="main-bets">
      <button class="main-bet-btn dragon-btn" onclick="placeMainBet('Dragon')">
        <span class="odds">0.95</span>
        Dragon
        <div style="font-size:11px; margin-top:4px;" id="dragonBetAmt">0</div>
      </button>
      <button class="main-bet-btn tie-btn" onclick="placeMainBet('Tie')">
        <span class="odds">45</span>
        Tie
        <div style="font-size:11px; margin-top:4px;" id="tieBetAmt">0</div>
      </button>
      <button class="main-bet-btn tiger-btn" onclick="placeMainBet('Tiger')">
        <span class="odds">0.95</span>
        Tiger
        <div style="font-size:11px; margin-top:4px;" id="tigerBetAmt">0</div>
      </button>
    </div>

    <div class="specific-bets">
      <div class="specific-title">DRAGON 11 (MIN:100 MAX:10000)</div>
      <div class="card-grid" id="dragonGrid"></div>
    </div>
    <div class="specific-bets" style="margin-top:12px;">
      <div class="specific-title">TIGER 11 (MIN:100 MAX:10000)</div>
      <div class="card-grid" id="tigerGrid"></div>
    </div>
  </div>

  <!-- Last Result -->
  <div class="last-result">
    <div class="last-result-title">LAST RESULT</div>
    <div id="lastResults" style="display:flex; gap:6px;"></div>
  </div>

  <!-- History -->
  <div class="history-section">
    <h3 style="text-align:center; color:#fbbf24; margin-bottom:10px;">History & Statement</h3>
    <div style="display:flex; justify-content:space-around; margin-bottom:10px; font-size:13px;">
      <div>Rounds: <span id="totalRounds">0</span></div>
      <div>Net: <span id="netProfit">0</span></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th><th>D</th><th>T</th><th>Result</th>
          <th>Bet</th><th>Amt</th><th>P/L</th><th>Bal</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
